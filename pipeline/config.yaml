style:
  palette: {bg: "#0E1116", fg: "#E8E6E1", accent: "#C8A24A", accent2: "#3C7DD9", danger: "#D0503C"}
  font_head: "assets/fonts/Fraunces-SemiBold.ttf"
  font_body: "assets/fonts/Inter-Regular.ttf"
  resolution: [1920, 1080]
  fps: 30
compliance:
  ai_disclosure_in_description: true
  synthetic_media_label: false     # set true per-video if realistic generated footage of real events/people
  max_uploads_per_week: 3
  require_sources: true
