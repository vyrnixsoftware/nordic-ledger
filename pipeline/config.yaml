  language: en
  cadence_per_week: 2
  publish_days: [Tue, Fri]
  publish_time_utc: "15:00"
voice:
  provider: auto          # elevenlabs (if ELEVENLABS_API_KEY) | piper | edge | auto
  elevenlabs_voice_id: "onwK4e9ZLuTAKqWW03F9"   # "Daniel" – calm British male, non-celebrity stock voice
  piper_model: "en-us-ryan-high"   # bundled in assets/voices; en-gb-alan-low also bundled
